<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#1a1a2e"/>
  <!-- Shopping bag body -->
  <rect x="12" y="26" width="40" height="30" rx="5" fill="#e94560"/>
  <!-- Bag handle -->
  <path d="M22 26 Q22 13 32 13 Q42 13 42 26"
    fill="none" stroke="#ffffff" stroke-width="3.5"
    stroke-linecap="round"/>
  <!-- Globe circle -->
  <circle cx="32" cy="41" r="10"
    fill="none" stroke="#ffffff" stroke-width="2" opacity="0.95"/>
  <!-- Globe vertical ellipse -->
  <ellipse cx="32" cy="41" rx="5" ry="10"
    fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
  <!-- Globe horizontal line -->
  <line x1="22" y1="41" x2="42" y2="41"
    stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
</svg>